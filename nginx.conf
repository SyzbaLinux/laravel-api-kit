# Nginx configuration — schools.emmanuelsiziba.co.zw
# Place this file at: /etc/nginx/sites-available/schools.emmanuelsiziba.co.zw
# Then: ln -s /etc/nginx/sites-available/schools.emmanuelsiziba.co.zw /etc/nginx/sites-enabled/
# And:  nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name schools.emmanuelsiziba.co.zw www.schools.emmanuelsiziba.co.zw;

    # Redirect HTTP → HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name schools.emmanuelsiziba.co.zw www.schools.emmanuelsiziba.co.zw;

    # ── SSL (update paths after running certbot) ──────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/schools.emmanuelsiziba.co.zw/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/schools.emmanuelsiziba.co.zw/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Shared headers ────────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    root /var/www/schools.emmanuelsiziba.co.zw/public;

    # ── Laravel API (php artisan serve on port 4301) ──────────────────────────
    location /api/ {
        proxy_pass http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Laravel storage & public assets (served directly)
    location /storage/ {
        alias /var/www/schools.emmanuelsiziba.co.zw/storage/app/public/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Angular SSR Frontend ──────────────────────────────────────────────────
    # Everything else goes to the Angular SSR Node server on port 3000
    location / {
        proxy_pass http://127.0.0.1:4300;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # ── Logs ─────────────────────────────────────────────────────────────────
    access_log /var/www/schools.emmanuelsiziba.co.zw/logs/nginx-access.log;
    error_log  /var/www/schools.emmanuelsiziba.co.zw/logs/nginx-error.log warn;
}
